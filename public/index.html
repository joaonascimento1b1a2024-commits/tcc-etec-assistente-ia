<!doctype html>
<!-- Landing Page pública: apresentação do assistente e acesso ao login. -->
<html lang="pt-br">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sylvinho | Assistente Virtual da ETEC</title>
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="stylesheet" href="./Landing-Page/style.css" />
        <link rel="stylesheet" href="./Arquivos-Universais/theme.css" />
        <script src="./Arquivos-Universais/theme.js"></script>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    </head>

    <body>
        <!-- Cabeçalho com as logos institucionais e os links de navegação. -->
        <header class="header">
            <div class="logo-group">
                <img
                    class="logoEtec"
                    src="./Arquivos-Universais/etec_ra_central_matao_sylvio_de_mattos_carvalho_br.png"
                    alt="logo etec Sylvio de Mattos Cavalho" />
                <img
                    class="logoEtec"
                    src="./Arquivos-Universais/logos_cps_governo_com_slogan_horizontal_br.png"
                    alt="logo Centro Paula Souza e Governo do estado de São Paulo" />
            </div>
            <!-- Links de navegação -->
            <nav class="nav-menu">
                <a href="#" class="nav-link active">Início</a>
                <a href="Sobre/sobre.html" class="nav-link">Sobre</a>
                <a href="Login/login.html" class="btn-acessar">Acessar</a>
            </nav>
        </header>

        <!-- Conteúdo principal da página inicial. -->
        <div id="corpo">
            <p class="academic-demo-banner" role="note">Protótipo de TCC — documentos de referência — não é atendimento oficial da escola.</p>
            <div id="principal">
                <h1>
                    Tire suas dúvidas<br />sem segundos.<br />A
                    <span style="color: red">Demonstração</span> acadêmica<br />da
                    <span style="color: red">ETEC</span>
                </h1>
            </div>
            <div>
                <p>
                    Um protótipo acadêmico que responde com trechos dos documentos de referência.
                </p>
                <div class="hero-actions">
                    <!-- O chat público restaura a sessão e encaminha quem já está conectado. -->
                    <a href="./Login/login.html" class="hero-button hero-button-primary"
                        >Começar agora →</a
                    >
                    <a href="./Chat/chat.html" class="hero-button hero-button-secondary">Ver como funciona</a>
                </div>
            </div>
        </div>
