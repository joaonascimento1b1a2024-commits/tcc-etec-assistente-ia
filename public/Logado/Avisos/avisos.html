<!doctype html>
<!-- Avisos do Firestore: leitura para alunos e gestão para administradores. -->
<html lang="pt-BR">
    <head>
        <!-- Codificação, adaptação a celulares e fontes compartilhadas com a área logada. -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>@media (min-width:721px) and (prefers-reduced-motion:no-preference) { @view-transition { navigation:auto; } }</style>
        <title>Avisos | Assistente ETEC IA</title>
        <link rel="stylesheet" href="avisos.css" />
        <script src="avisos.js" type="module"></script>
        <link rel="stylesheet" href="../../Arquivos-Universais/theme.css" />
        <script src="../../Arquivos-Universais/theme.js"></script>
        <script src="../shell-init.js"></script>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <link rel="stylesheet" href="../../Arquivos-Universais/visual.css" />
    <link rel="stylesheet" href="../layout.css" />
    <link rel="stylesheet" href="../shell.css" />
<script defer src="../../Arquivos-Universais/ui.js"></script>
</head>
    <body>
        <!-- Atalho de teclado para pular o menu e acessar os avisos. -->
        <a class="skip-link" href="#conteudo">Ir para os avisos</a>
        <aside class="sidebar">
            <a class="school-logo" href="../Home/home.html" aria-label="ETEC — início">
                <img src="../Home/etec_ra_central_matao_sylvio_de_mattos_carvalho_br.png" id="etec" alt="Logo Etec" width="863" height="544" />
            </a>
            <a class="new-chat" href="../Home/home.html"><span class="new-chat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"></path></svg></span><span class="new-chat-label">Novo chat</span></a>
            <!-- Destinos ainda não implementados ficam desabilitados, sem links quebrados. -->
            <nav aria-label="Menu principal">
                <a href="../Home/home.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg></span><span class="nav-label">Início</span></a>
                <a href="../Conversas/conversas.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5Z M8 10h8 M8 14h5"></path></svg></span><span class="nav-label">Conversas</span></a
                >
                <a href="avisos.html" aria-current="page"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4"></path></svg></span><span class="nav-label">Avisos</span></a
                >
                <a href="../Serviços/servicos.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5h6l2 2h10v13H3Z"></path></svg></span><span class="nav-label">Serviços</span></a>
                <a id="settings-link" href="../Configurações Aluno/configAl.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 3 3 3-2v-3l3-2-1-4-3-1-1-3z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"></path></svg></span><span class="nav-label">Configurações</span></a
                >
            </nav>
        </aside>
        <main id="conteudo" class="content" tabindex="-1">
            <header>
                <h1>Avisos</h1>
                <p id="page-description">Fique por dentro das novidades</p>
            </header>
            <!-- O JavaScript comunica o estado da consulta sem anunciar toda a lista novamente. -->
            <div class="notice-area">
<div class="list-tools"><label for="noticeCategory">Categoria<select id="noticeCategory"><option value="">Todas</option><option value="matricula">Matrícula</option><option value="provas">Provas</option><option value="feriado">Feriado</option><option value="evento">Evento</option><option value="geral">Geral</option></select></label></div><p id="filterSummary" class="filter-summary" role="status"></p>
                <div id="admin-toolbar" class="admin-toolbar" hidden>
                    <label class="selection-label">
                        <input id="select-all" type="checkbox" /> Selecionar todos
                    </label>
                    <span id="selection-count" role="status" aria-live="polite"></span>
                    <button
                        id="delete-selected"
                        class="notice-button danger"
                        type="button"
                        disabled>
                        Excluir selecionados
                    </button>
                </div>
                <p id="action-feedback" class="feedback" role="status" hidden></p>
                <p id="status" role="status" aria-live="polite">Carregando avisos...</p>
                <button id="retry" class="retry" type="button" hidden>Tentar novamente</button>
                <a id="login" class="retry" href="../../Login/login.html" hidden
                    >Entrar na minha conta</a
                >
                <ul
                    id="noticeList"
                    class="notice-list"
                    aria-label="Avisos do protótipo"
                    aria-busy="true"></ul>
                <noscript>Ative o JavaScript e entre na sua conta para visualizar os avisos publicados.</noscript>
            </div>
        </main>
        <!-- Estrutura reaproveitada para cada documento retornado pelo Firestore. -->
        <template id="noticeTemplate">
            <li>
                <article class="notice-card">
                    <div class="notice-icon" aria-hidden="true"></div>
                    <div class="notice-copy">
                        <h2></h2>
                        <p></p>
                        <span class="draft-label" hidden>Rascunho</span>
                    </div>
                    <div class="notice-admin" hidden>
                        <label class="selection-label">
                            <input class="notice-select" type="checkbox" /> Selecionar
                        </label>
                        <div class="notice-actions">
                            <button class="notice-button" type="button" data-action="edit">
                                Editar
                            </button>
                            <button class="notice-button danger" type="button" data-action="delete">
                                Excluir
                            </button>
                        </div>
                    </div>
                </article>
            </li>
        </template>
        <dialog id="edit-dialog" aria-labelledby="edit-title">
            <form id="edit-form" class="notice-form">
                <h2 id="edit-title">Editar aviso</h2>
                <label for="edit-name">Título</label>
                <input id="edit-name" maxlength="150" required />
                <label for="edit-category">Categoria</label>
                <select id="edit-category">
                    <option value="geral">Geral</option>
                    <option value="matricula">Matrícula</option>
                    <option value="provas">Provas</option>
                    <option value="feriado">Feriado</option>
                    <option value="evento">Evento</option>
                </select>
                <label for="edit-description">Descrição</label>
                <textarea id="edit-description" rows="6" maxlength="5000" required></textarea>
                <p id="edit-feedback" class="feedback" role="status" hidden></p>
                <div class="dialog-actions">
                    <button class="notice-button" type="button" data-close="edit-dialog">
                        Cancelar
                    </button>
                    <button class="notice-button primary" type="submit">Salvar alterações</button>
                </div>
            </form>
        </dialog>
        <dialog
            id="delete-dialog"
            aria-labelledby="delete-title"
            aria-describedby="delete-description">
            <form id="delete-form" class="notice-form">
                <h2 id="delete-title">Excluir avisos?</h2>
                <p id="delete-description"></p>
                <ul id="delete-preview"></ul>
                <p id="delete-feedback" class="feedback" role="status" hidden></p>
                <div class="dialog-actions">
                    <button
                        id="cancel-delete"
                        class="notice-button"
                        type="button"
                        data-close="delete-dialog">
                        Cancelar
                    </button>
                    <button id="confirm-delete" class="notice-button primary" type="submit">
                        Confirmar exclusão
                    </button>
                </div>
            </form>
        </dialog>
    </body>
</html>
