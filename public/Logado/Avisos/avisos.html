<!doctype html>
<!-- Avisos do Firestore: leitura para alunos e gestão para administradores. -->
<html lang="pt-BR" data-demo-academica="prototipo">
    <head>
        <!-- Codificação, adaptação a celulares e fontes compartilhadas com a área logada. -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Avisos | Assistente ETEC IA</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
        <link rel="stylesheet" href="avisos.css" />
        <script src="avisos.js" type="module"></script>
        <link rel="stylesheet" href="../../Arquivos-Universais/theme.css" />
        <script src="../../Arquivos-Universais/theme.js"></script>
    </head>
    <body>
        <!-- Atalho de teclado para pular o menu e acessar os avisos. -->
        <a class="skip-link" href="#conteudo">Ir para os avisos</a>
        <aside class="sidebar">
            <a class="school-logo" href="../Home/home.html" aria-label="ETEC — início">
                <img src="../Home/etec_ra_central_matao_sylvio_de_mattos_carvalho_br.png" id="etec" alt="Logo Etec" />
            </a>
            <a class="new-chat" href="../Home/home.html">+ Novo chat</a>
            <!-- Destinos ainda não implementados ficam desabilitados, sem links quebrados. -->
            <nav aria-label="Menu principal">
                <a href="../Home/home.html"><span aria-hidden="true">⌂</span> Início</a>
                <a href="../Conversas/conversas.html"
                    ><span aria-hidden="true">▤</span> Conversas</a
                >
                <a href="avisos.html" aria-current="page"
                    ><span aria-hidden="true">♧</span> Avisos</a
                >
                <a href="../Serviços/servicos.html"><span aria-hidden="true">▱</span> Serviços</a>
                <a id="settings-link" href="../Configurações Aluno/configAl.html"
                    ><span aria-hidden="true">⚙</span> Configurações</a
                >
            </nav>
        </aside>
        <main id="conteudo" class="content" tabindex="-1">
            <p class="academic-demo-banner" role="note">Protótipo de TCC — documentos de referência — não é atendimento oficial da escola.</p>
            <header>
                <h1>Avisos</h1>
                <p id="page-description">Fique por dentro das novidades</p>
            </header>
            <!-- O JavaScript comunica o estado da consulta sem anunciar toda a lista novamente. -->
            <div class="notice-area">
                <div id="admin-toolbar" class="admin-toolbar" hidden>
                    <label class="selection-label">
                        <input id="select-all" type="checkbox" /> Selecionar todos
                    </label>
                    <span id="selection-count" role="status" aria-live="polite"></span>
                    <button
                        id="delete-selected"
                        class="notice-button danger"
                        type="button"
                        disabled>
                        Excluir selecionados
                    </button>
                </div>
                <p id="action-feedback" class="feedback" role="status" hidden></p>
                <p id="status" role="status" aria-live="polite">Carregando avisos...</p>
                <button id="retry" class="retry" type="button" hidden>Tentar novamente</button>
                <a id="login" class="retry" href="../../Login/login.html" hidden
                    >Entrar na minha conta</a
                >
                <ul
                    id="noticeList"
                    class="notice-list"
                    aria-label="Avisos do protótipo"
                    aria-busy="true"></ul>
                <noscript>Ative o JavaScript para visualizar o status de avisos. Avisos da escola não são consultados nesta demonstração.</noscript>
            </div>
        </main>
        <!-- Estrutura reaproveitada para cada documento retornado pelo Firestore. -->
        <template id="noticeTemplate">
            <li>
                <article class="notice-card">
                    <div class="notice-icon" aria-hidden="true"></div>
                    <div class="notice-copy">
                        <h2></h2>
                        <p></p>
                        <span class="draft-label" hidden>Rascunho</span>
                    </div>
                    <div class="notice-admin" hidden>
                        <label class="selection-label">
                            <input class="notice-select" type="checkbox" /> Selecionar
                        </label>
                        <div class="notice-actions">
                            <button class="notice-button" type="button" data-action="edit">
                                Editar
                            </button>
                            <button class="notice-button danger" type="button" data-action="delete">
                                Excluir
                            </button>
                        </div>
                    </div>
                </article>
            </li>
        </template>
        <dialog id="edit-dialog" aria-labelledby="edit-title">
            <form id="edit-form" class="notice-form">
                <h2 id="edit-title">Editar aviso</h2>
                <label for="edit-name">Título</label>
                <input id="edit-name" maxlength="150" required />
                <label for="edit-category">Categoria</label>
                <select id="edit-category">
                    <option value="geral">Geral</option>
                    <option value="matricula">Matrícula</option>
                    <option value="provas">Provas</option>
                    <option value="feriado">Feriado</option>
                    <option value="evento">Evento</option>
                </select>
                <label for="edit-description">Descrição</label>
                <textarea id="edit-description" rows="6" maxlength="5000" required></textarea>
                <p id="edit-feedback" class="feedback" role="status" hidden></p>
                <div class="dialog-actions">
                    <button class="notice-button" type="button" data-close="edit-dialog">
                        Cancelar
                    </button>
                    <button class="notice-button primary" type="submit">Salvar alterações</button>
                </div>
            </form>
        </dialog>
        <dialog
            id="delete-dialog"
            aria-labelledby="delete-title"
            aria-describedby="delete-description">
            <form id="delete-form" class="notice-form">
                <h2 id="delete-title">Excluir avisos?</h2>
                <p id="delete-description"></p>
                <ul id="delete-preview"></ul>
                <p id="delete-feedback" class="feedback" role="status" hidden></p>
                <div class="dialog-actions">
                    <button
                        id="cancel-delete"
                        class="notice-button"
                        type="button"
                        data-close="delete-dialog">
                        Cancelar
                    </button>
                    <button id="confirm-delete" class="notice-button primary" type="submit">
                        Confirmar exclusão
                    </button>
                </div>
            </form>
        </dialog>
    </body>
</html>
