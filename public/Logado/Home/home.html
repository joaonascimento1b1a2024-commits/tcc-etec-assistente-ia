<!doctype html>
<!-- Home compartilhada: perfil, sugestões e conversa persistida da conta autenticada. -->
<html lang="pt-BR">
    <head>
        <!-- Define a codificação de caracteres e adapta a página à largura do dispositivo. -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>@media (min-width:721px) and (prefers-reduced-motion:no-preference) { @view-transition { navigation:auto; } }</style>
        <title>Assistente ETEC IA</title>

        <!-- Antecipa a conexão com o Google Fonts e carrega os pesos usados da fonte Poppins. -->
        <!-- Carrega os estilos desta página, incluindo os ajustes para telas menores. -->
        <link rel="stylesheet" href="home.css" />
        <link rel="stylesheet" href="../../Arquivos-Universais/theme.css" />
        <script src="../../Arquivos-Universais/theme.js"></script>
        <script src="../shell-init.js"></script>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <link rel="stylesheet" href="../../Arquivos-Universais/visual.css" />
    <link rel="stylesheet" href="../layout.css" />
    <link rel="stylesheet" href="../shell.css" />
<script defer src="../../Arquivos-Universais/ui.js"></script>
</head>

    <body>
        <a class="shell-skip-link" href="#conteudo">Ir para a conversa</a>
        <!-- Menu lateral: identificação da escola, nova conversa e opções de navegação. -->
        <aside class="sidebar">
            <!-- Logo da escola com tamanho adaptado à largura do menu. -->
            <div class="school-logo">
                <img src="etec_ra_central_matao_sylvio_de_mattos_carvalho_br.png" id="etec" alt="Logo Etec" width="863" height="544" />
            </div>

            <!-- O JavaScript usa este ID para limpar as mensagens e voltar à tela inicial. -->
            <button class="new-chat" id="newChat"><span class="new-chat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"></path></svg></span><span class="new-chat-label">Novo chat</span></button>

            <!-- data-page identifica o item destacado; Conversas abre o histórico salvo. -->
            <nav aria-label="Menu principal">
                <a class="nav-link active" href="home.html" data-page="home"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg></span><span class="nav-label">Início</span></a
                >
                <a class="nav-link" href="../Conversas/conversas.html" data-page="chat"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5Z M8 10h8 M8 14h5"></path></svg></span><span class="nav-label">Conversas</span></a
                >
                <a class="nav-link" href="../Avisos/avisos.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4"></path></svg></span><span class="nav-label">Avisos</span></a>
                <a class="nav-link" href="../Serviços/servicos.html"><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5h6l2 2h10v13H3Z"></path></svg></span><span class="nav-label">Serviços</span></a>
                <a class="nav-link" id="settingsLink" href="../Configurações Aluno/configAl.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 3 3 3-2v-3l3-2-1-4-3-1-1-3z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"></path></svg></span><span class="nav-label">Configurações</span></a
                >
            </nav>
        </aside>

        <!-- Área principal: cabeçalho, tela inicial, conversa e barra de mensagem. -->
        <main class="app-content" id="conteudo" tabindex="-1">
            <!-- Cabeçalho com a identificação do assistente e os dados do perfil. -->
            <header class="topbar">
                <div class="assistant-brand">
                    <span class="assistant-avatar"><img id="logo" src="Logo s_fundo.png" alt="Logo Sylvinho"></span>
                    <span class="assistant-identity">Sylvinho</span>
                </div>

                <!-- Foto e nome formam um único link, acessível também pelo teclado. -->
                <a
                    class="profile"
                    id="profileLink"
                    href="../Configurações Aluno/configAl.html"
                    aria-label="Abrir configurações da conta">
                    <img id="profileImage" alt="" hidden />
                    <span id="profileName">Carregando perfil...</span>
                </a>
            </header>

            <!-- Tela exibida inicialmente e ao selecionar Novo chat. -->
            <section class="home-screen" id="homeScreen">
                <!-- O JavaScript personaliza a saudação com o primeiro nome da conta. -->
                <div class="welcome">
                    <h1 id="welcomeName">Olá!</h1>
                    <p>Como posso ajudar você hoje?</p>
                </div>

                <!-- Cartões de atendimento: data-message guarda o texto enviado ao clicar. -->
                <div class="feature-cards">
                    <button
                        class="feature-card"
                        data-message="Quero solicitar documentos e declarações.">
                        <b class="card-icon">▰</b>
                        <span>
                            <strong>Solicitar documentos</strong>
                            <small>Peça documentos e declarações</small>
                        </span>
                    </button>

                    <button
                        class="feature-card"
                        data-message="Quero consultar o calendário acadêmico.">
                        <b class="card-icon">▣</b>
                        <span>
                            <strong>Calendário acadêmico</strong>
                            <small>Datas importantes e eventos</small>
                        </span>
                    </button>

                    <button
                        class="feature-card"
                        data-message="Preciso de informações sobre matrícula.">
                        <b class="card-icon">▱</b>
                        <span>
                            <strong>Matrícula</strong>
                            <small>Informações sobre matrícula</small>
                        </span>
                    </button>
                </div>

                <!-- Perguntas prontas que abrem a conversa e enviam o texto selecionado. -->
                <div class="home-suggestions">
                    <button data-message="Como faço para renovar minha matrícula?">
                        Como faço para renovar minha matrícula?
                    </button>
                    <button data-message="Quais documentos preciso para me matricular?">
                        Quais documentos preciso para me matricular?
                    </button>
                    <button data-message="Quais os horários de atendimento da secretaria?">
                        Quais os horários de atendimento da secretaria?
                    </button>
                </div>
            </section>

            <!-- Tela da conversa, inicialmente oculta pela classe hidden.
             aria-live permite anunciar atualizações a leitores de tela sem interromper a leitura. -->
            <section class="chat-screen hidden" id="chatScreen" aria-live="polite">
                <!-- Lista preenchida pelo JavaScript com os balões do usuário e do assistente. -->
                <div class="messages" id="messages"></div>

                <!-- Atalhos de perguntas disponíveis dentro da conversa. -->
                <div class="chat-suggestions">
                    <button data-message="Como faço a matrícula?">Como faço a matrícula?</button>
                    <button data-message="Qual é o horário de funcionamento?">
                        Horário de funcionamento
                    </button>
                    <button data-message="Quero falar com um atendente.">
                        Falar com atendente
                    </button>
                </div>
            </section>

            <!-- Formulário compartilhado pelas duas telas; o JavaScript trata o envio. -->
            <!-- Informa conexão, salvamento e falhas sem confundir uma demonstração com resposta real. -->
            <p id="chatStatus" role="status" class="chat-status">Conectando à sua conta...</p>
            <button id="retrySend" type="button" class="retry-send" hidden disabled>Tentar novamente</button>
            <section id="demonstracaoPanel" class="demonstracao-panel" hidden aria-label="Demonstração restrita de IA">
                <p>Demonstração sintética — não é informação escolar oficial.</p>
                <label for="demonstracaoSelect">Selecione uma pergunta autorizada</label>
                <select id="demonstracaoSelect" disabled></select>
                <p id="demonstracaoPergunta"></p>
                <button id="demonstracaoEnviar" type="button" disabled>Enviar pergunta de demonstração</button>
                <button id="demonstracaoRecuperar" type="button" hidden disabled>Retomar demonstração pendente</button>
            </section>
            <form class="message-form" id="messageForm">
                <!-- Rótulo acessível a leitores de tela, oculto visualmente pelo CSS. -->
                <label class="sr-only" for="messageInput">Sua mensagem</label>

                <!-- Campo com limite de 700 caracteres digitados e preenchimento automático desativado. -->
                <textarea id="messageInput"
                    autocomplete="off"
                    placeholder="Digite sua mensagem..."
                    maxlength="700"  rows="1"></textarea>

                <!-- Dispara o evento submit do formulário para enviar a mensagem. -->
                <button class="send" type="submit" aria-label="Enviar mensagem">→</button>
            </form>
        </main>

        <!-- Carrega os comportamentos depois que os elementos da página já foram criados. -->
        <script src="resposta-documental-view.js"></script>
        <script src="home.js"></script>
    </body>
</html>
