<!doctype html>
<!-- Histórico particular: abrir, renomear ou excluir conversas e iniciar uma nova. -->
<html lang="pt-BR">
    <head>
        <!-- A largura acompanha o dispositivo; os estilos básicos reutilizam o menu da Home. -->
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <style>@media (min-width:721px) and (prefers-reduced-motion:no-preference) { @view-transition { navigation:auto; } }</style>
        <title>Minhas conversas | Assistente ETEC</title>
        <link rel="stylesheet" href="../Home/home.css" />
        <link rel="stylesheet" href="conversas.css" />
        <link rel="stylesheet" href="../../Arquivos-Universais/theme.css" />
        <script src="../../Arquivos-Universais/theme.js"></script>
        <script src="../shell-init.js"></script>
        <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <link rel="stylesheet" href="../../Arquivos-Universais/visual.css" />
    <link rel="stylesheet" href="../layout.css" />
    <link rel="stylesheet" href="../shell.css" />
<script defer src="../../Arquivos-Universais/ui.js"></script>
</head>
    <body>
        <!-- Links reais permitem navegar também usando teclado ou abrindo outra aba. -->
        <aside class="sidebar">
            <div class="school-logo">
                <img src="../Home/etec_ra_central_matao_sylvio_de_mattos_carvalho_br.png" id="etec" alt="Logo Etec" width="863" height="544" />
            </div>
            <a class="new-chat" href="../Home/home.html"><span class="new-chat-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14 M5 12h14"></path></svg></span><span class="new-chat-label">Novo chat</span></a>
            <nav aria-label="Menu principal">
                <a class="nav-link" href="../Home/home.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg></span><span class="nav-label">Início</span></a
                >
                <a class="nav-link active" href="conversas.html" aria-current="page"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5Z M8 10h8 M8 14h5"></path></svg></span><span class="nav-label">Conversas</span></a
                >
                <a class="nav-link" href="../Avisos/avisos.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9 M10 21h4"></path></svg></span><span class="nav-label">Avisos</span></a
                >
                <a class="nav-link" href="../Serviços/servicos.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5h6l2 2h10v13H3Z"></path></svg></span><span class="nav-label">Serviços</span></a
                >
                <a class="nav-link" href="../Configurações Aluno/configAl.html"
                    ><span class="nav-icon" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m9 3-1 3-3 1-2 3 2 2-1 4 3 2 3-1 3 3 3-2v-3l3-2-1-4-3-1-1-3z M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0"></path></svg></span><span class="nav-label">Configurações</span></a
                >
            </nav>
        </aside>
        <main class="app-content history-content">
            <header class="history-heading">
                <div>
                    <h1>Conversas</h1>
                    <p>Continue de onde parou.</p>
                </div>
                <a class="primary-action" href="../Home/home.html">+ Nova mensagem</a>
            </header>
            <!-- Os estados de carregamento, vazio e erro são anunciados sem mover o foco. -->
            <p id="historyStatus" role="status">Carregando suas conversas...</p>
            <p class="history-note">Você pode renomear suas conversas a qualquer momento.</p>
<div class="list-tools"><label for="historySearch">Buscar nas suas conversas<input id="historySearch" type="search" placeholder="Pesquisar pelo título" autocomplete="off" /></label></div>
            <ul id="conversationList" class="conversation-list" aria-label="Conversas salvas"></ul>
        </main>
        <!-- Um diálogo compartilhado permite renomear ou confirmar a exclusão permanente. -->
        <dialog id="conversationDialog" aria-labelledby="dialogTitle">
            <form id="dialogForm">
                <h2 id="dialogTitle"></h2>
                <p id="dialogDescription"></p>
                <label id="titleLabel" for="titleInput">Título da conversa</label>
                <input id="titleInput" maxlength="100" autocomplete="off" />
                <p id="dialogError" role="alert"></p>
                <div class="dialog-actions">
                    <button type="button" id="cancelDialog">Cancelar</button
                    ><button type="submit" id="confirmDialog" class="primary-action">Salvar</button>
                </div>
            </form>
        </dialog>
        <script type="module" src="conversas.js"></script>
    </body>
</html>
